<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sena Module-Driven ERP</title>
  <style>
    :root {
      --bg:#07151a; --panel:#101f27; --panel-2:#142d35; --line:rgba(148,163,184,.16); --text:#ecfeff; --muted:#9eb5c1; --primary:#14b8a6; --forest:#0f766e; --gold:#f59e0b; --violet:#8b5cf6; --danger:#ef4444; --shadow:0 18px 30px rgba(0,0,0,.25)
    }
    *{box-sizing:border-box} html,body{margin:0;font-family:Inter,'Segoe UI',sans-serif;background:radial-gradient(circle at top,#0d1f24,#071319,#040d11);color:var(--text)}
    body{min-height:100vh} a{text-decoration:none;color:inherit} button,input,select{font:inherit}
    .app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
    .sidebar{background:rgba(8,20,24,.92);border-right:1px solid var(--line);padding:18px 14px}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 18px}.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#34d399);display:grid;place-items:center}.nav{display:grid;gap:8px}.nav-btn{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border:1px solid transparent;border-radius:12px;color:var(--text);background:transparent;cursor:pointer}.nav-btn.active{background:rgba(20,184,166,.12);border-color:rgba(20,184,166,.2)}.nav-btn .left{display:flex;align-items:center;gap:10px}.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
    .content{padding:18px}.page{display:none}.page.active{display:block}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(16,31,39,.9);margin-bottom:18px}
    .bar-left{display:flex;align-items:center;gap:10px}.chip{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(17,43,52,.7);font-size:.72rem;color:var(--muted)}.btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--forest));color:#fff;font-weight:700}.btn.secondary{background:rgba(17,43,52,.9);border:1px solid var(--line)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{padding:18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,30,36,.95),rgba(10,22,27,.95));box-shadow:var(--shadow)}.kpi-value{font-size:1.8rem;font-weight:800;margin-top:8px}.kpi-label{color:var(--muted);font-size:.7rem}.kpi-trend{margin-top:12px;display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(34,197,94,.14);color:#b4fccc;border:1px solid rgba(34,197,94,.22);font-size:.7rem}
    .panel-title{margin:0 0 12px;font-size:1rem}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:.8rem;text-align:left}.table th{color:var(--muted);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
    .tag{padding:5px 8px;border-radius:999px;font-size:.7rem;border:1px solid transparent;display:inline-block}.tag.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.24);color:#b9f8d5}.tag.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.24);color:#f8d38d}.tag.alert{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.24);color:#fecaca}.tag.info{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.24);color:#bfdbfe}
    .two-col{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.stack{display:grid;gap:12px}.stat-box{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(15,25,30,.7)}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field{display:grid;gap:8px}.field label{color:var(--muted);font-size:.72rem}.field input,.field select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(9,20,25,.75);color:var(--text)}
    @media(max-width:840px){.app{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--line)}.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">🌿</div>
        <div><strong>Sena ERP</strong><div style="color:var(--muted);font-size:.72rem;">Modular business core</div></div>
      </div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="content">
      <div class="topbar">
        <div class="bar-left">
          <span class="chip">Enterprise</span>
          <span class="chip">Multi-role hierarchy</span>
        </div>
        <div class="bar-left">
          <button class="btn secondary">Sync</button>
          <button class="btn">Approve</button>
        </div>
      </div>
      <div id="pageHost"></div>
    </main>
  </div>

  <script>
    const modules = {
      overview: {
        label: 'Overview',
        render() {
          return `
            <div class="grid">
              <div class="card"><div class="kpi-label">Revenue</div><div class="kpi-value">$2.48M</div><span class="kpi-trend">+18.4%</span></div>
              <div class="card"><div class="kpi-label">Farm coverage</div><div class="kpi-value">324</div><span class="kpi-trend">+26 plots</span></div>
              <div class="card"><div class="kpi-label">Field health</div><div class="kpi-value">87.4</div><span class="kpi-trend">Stable</span></div>
              <div class="card"><div class="kpi-label">Approvals</div><div class="kpi-value">14</div><span class="kpi-trend">CEO queue</span></div>
            </div>
            <div class="two-col" style="margin-top:18px;">
              <div class="card"><h3 class="panel-title">Ops pipeline</h3><div class="table-wrap"><table class="table"><thead><tr><th>Task</th><th>Status</th><th>Owner</th></tr></thead><tbody><tr><td>Crop risk review</td><td><span class="tag warn">Waiting</span></td><td>Agronomist</td></tr><tr><td>Supply release</td><td><span class="tag ok">Approved</span></td><td>Finance</td></tr></tbody></table></div></div>
              <div class="card"><h3 class="panel-title">AI guidance</h3><div class="stack"><div class="stat-box"><strong>Water stress</strong><div style="color:var(--muted);margin-top:8px;">North-west rows show moisture deterioration. Inspect in 48 hours.</div></div><div class="stat-box"><strong>Yield optimization</strong><div style="color:var(--muted);margin-top:8px;">Micro-nutrient dosing could lift revenue by 9–12%.</div></div></div></div>
            </div>
          `;
        }
      },
      farms: {
        label: 'Farmer registry',
        render() {
          return `
            <div class="card">
              <h3 class="panel-title">Farm entity registry</h3>
              <div class="form-grid" style="margin-bottom:16px;">
                <div class="field"><label>Farm name</label><input value="Kombolcha Block A" /></div>
                <div class="field"><label>Crop</label><select><option>Coffee</option><option>Maize</option><option>Vegetables</option></select></div>
                <div class="field"><label>Acres</label><input value="420" /></div>
                <div class="field"><label>Coordinator</label><input value="H. Mulugeta" /></div>
              </div>
              <div class="table-wrap"><table class="table"><thead><tr><th>Farm</th><th>Crop</th><th>Acres</th><th>Status</th></tr></thead><tbody><tr><td>Kombolcha Block A</td><td>Coffee</td><td>420</td><td><span class="tag ok">Healthy</span></td></tr><tr><td>Dilla South</td><td>Maize</td><td>260</td><td><span class="tag warn">Monitoring</span></td></tr></tbody></table></div>
            </div>
          `;
        }
      },
      operations: {
        label: 'Operations',
        render() {
          return `
            <div class="card">
              <h3 class="panel-title">Execution entities</h3>
              <div class="table-wrap"><table class="table"><thead><tr><th>Operation</th><th>Region</th><th>Priority</th><th>Assignee</th><th>Status</th></tr></thead><tbody><tr><td>Drone field scan</td><td>Jimma</td><td><span class="tag warn">High</span></td><td>Ops lead</td><td><span class="tag ok">In progress</span></td></tr><tr><td>Equipment maintenance</td><td>Bale</td><td><span class="tag alert">Critical</span></td><td>Fleet team</td><td><span class="tag info">Scheduled</span></td></tr></tbody></table></div>
            </div>
          `;
        }
      },
      finance: {
        label: 'Finance',
        render() {
          return `
            <div class="card">
              <h3 class="panel-title">Ledger and settlement entities</h3>
              <div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>Coffee export</td><td>Income</td><td>$465,000</td><td><span class="tag ok">Cleared</span></td></tr><tr><td>Input purchase</td><td>Expense</td><td>-$192,000</td><td><span class="tag info">Approved</span></td></tr></tbody></table></div>
            </div>
          `;
        }
      },
      intelligence: {
        label: 'AI intelligence',
        render() {
          return `
            <div class="two-col">
              <div class="card"><h3 class="panel-title">Recommendations engine</h3><div class="stack"><div class="stat-box"><strong>Crop recommendation</strong><div style="color:var(--muted);margin-top:8px;">Apply targeted foliar feed to improve yield in the next cycle.</div></div><div class="stat-box"><strong>Procurement guidance</strong><div style="color:var(--muted);margin-top:8px;">Supplier variance is 7.3% above benchmark; renegotiate terms.</div></div></div></div>
              <div class="card"><h3 class="panel-title">Decision records</h3><div class="stack"><div class="stat-box"><strong>Risk score: 64/100</strong><div style="color:var(--muted);margin-top:8px;">Moderate risk. Intervene on water and logistics.</div></div><div class="stat-box"><strong>Confidence: 91%</strong><div style="color:var(--muted);margin-top:8px;">Reasoning based on crop, weather, and market data.</div></div></div></div>
            </div>
          `;
        }
      },
      approvals: {
        label: 'Approvals',
        render() {
          return `
            <div class="card">
              <h3 class="panel-title">Executive approval queue</h3>
              <div class="table-wrap"><table class="table"><thead><tr><th>Request</th><th>Authority</th><th>Stage</th><th>Decision</th></tr></thead><tbody><tr><td>Seed batch approval</td><td>CEO</td><td>Board review</td><td><span class="tag warn">Pending</span></td></tr><tr><td>Field subsidy release</td><td>Finance</td><td>CEO signoff</td><td><span class="tag info">Waiting</span></td></tr></tbody></table></div>
            </div>
          `;
        }
      }
    };

    const nav = document.getElementById('nav');
    const pageHost = document.getElementById('pageHost');
    let activeModule = 'overview';

    function renderNav() {
      nav.innerHTML = Object.entries(modules).map(([key, value]) => `
        <button class="nav-btn ${key === activeModule ? 'active' : ''}" data-key="${key}">
          <span class="left"><span class="nav-dot"></span>${value.label}</span><span style="color:var(--muted);font-size:.72rem;">${key === 'overview' ? '24' : '7'}</span>
        </button>
      `).join('');
      nav.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeModule = btn.dataset.key;
          renderNav();
          renderPage();
        });
      });
    }

    function renderPage() {
      pageHost.innerHTML = modules[activeModule].render();
    }

    renderNav();
    renderPage();
  </script>
</body>
</html>
