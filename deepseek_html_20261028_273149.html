<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Sena FarmERP — enterprise-grade agribusiness ERP for inclusive agriculture, field operations, AI insight, cloud sync, and governance." />
  <meta name="theme-color" content="#0f766e" />
  <title>Sena FarmERP | Enterprise Agribusiness Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #07111d;
      --bg-2: #0d1728;
      --panel: rgba(17, 24, 39, 0.88);
      --panel-2: rgba(15, 23, 42, 0.92);
      --card: #101b2d;
      --card-2: #122033;
      --line: rgba(148, 163, 184, 0.2);
      --line-strong: rgba(45, 212, 191, 0.35);
      --primary: #0f766e;
      --primary-2: #14b8a6;
      --accent: #22c55e;
      --warning: #fbbf24;
      --danger: #ef4444;
      --info: #60a5fa;
      --violet: #8b5cf6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --shadow: 0 20px 50px rgba(2, 6, 23, 0.45);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #102235 0%, #07111d 38%, #050d18 100%);
      color: var(--text);
      overflow: hidden;
    }
    a { color: inherit; }
    button, input, select, textarea { font: inherit; }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 16px;
      background: rgba(15, 23, 42, 0.86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 5;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .logo {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(19, 78, 74, 0.8), rgba(20, 184, 166, 0.2));
      border: 1px solid rgba(45, 212, 191, 0.4);
      box-shadow: inset 0 0 20px rgba(45, 212, 191, 0.12);
    }
    .brand-title {
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary-2); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lang-switch {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-right: 4px;
    }
    .lang-btn, .btn, .ghost-btn, .nav-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      cursor: pointer;
      transition: 0.2s ease;
    }
    .lang-btn {
      padding: 6px 8px;
      font-size: 11px;
      opacity: 0.8;
    }
    .lang-btn.active {
      background: rgba(15, 118, 110, 0.25);
      border-color: rgba(45, 212, 191, 0.4);
      color: #b8fff3;
      opacity: 1;
    }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge.info { background: rgba(59,130,246,.12); color: #93c5fd; border-color: rgba(96,165,250,.28); }
    .badge.success { background: rgba(34,197,94,.12); color: #86efac; border-color: rgba(34,197,94,.25); }
    .badge.warn { background: rgba(251,191,36,.12); color: #fcd34d; border-color: rgba(251,191,36,.35); }
    .badge.danger { background: rgba(239,68,68,.12); color: #fca5a5; border-color: rgba(239,68,68,.3); }

    .btn, .ghost-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 12px; font-weight: 700; font-size: 12px; letter-spacing: 0.01em;
      min-height: 36px;
    }
    .btn:hover, .ghost-btn:hover, .nav-btn:hover, .lang-btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: rgba(45,212,191,0.35);
      color: white;
    }
    .btn.secondary {
      background: rgba(30,41,59,0.9);
      border-color: rgba(148,163,184,0.2);
    }
    .btn.danger {
      background: rgba(127,29,29,0.8);
      border-color: rgba(239,68,68,0.45);
      color: #fecaca;
    }
    .ghost-btn {
      background: rgba(15, 23, 42, 0.7);
      border-color: rgba(148,163,184,0.18);
    }

    .content-shell {
      display: flex;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 245px;
      background: rgba(15,23,42,0.86);
      border-right: 1px solid var(--line);
      padding: 10px 8px 12px;
      overflow-y: auto;
    }
    .nav-group {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 16px;
    }
    .nav-btn {
      width: 100%; text-align: left; padding: 10px 12px; background: transparent; border: 1px solid transparent; color: #d8e3f4;
      font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .nav-btn.active {
      background: rgba(15,118,110,0.16); border-color: rgba(45,212,191,0.3); color: #7ef2dc; box-shadow: inset 3px 0 0 rgba(20,184,166,0.8);
    }
    .nav-btn small {
      font-size: 10px; color: var(--muted); opacity: 0.8;
    }

    .main-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 24px;
    }

    .module-view {
      display: flex; flex-direction: column; gap: 16px;
    }

    .kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
    }
    .kpi-card, .panel, .card-panel {
      background: linear-gradient(180deg, rgba(17,24,39,.88), rgba(11,18,29,.9));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .kpi-card {
      min-height: 120px; padding: 16px; position: relative; overflow: hidden;
    }
    .kpi-card::before {
      content: ""; position: absolute; inset: 0 auto auto 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--primary-2), transparent);
    }
    .kpi-label {
      color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .kpi-value {
      font-size: clamp(1.7rem, 2.5vw, 2.4rem); font-weight: 800; margin: 12px 0 6px;
    }
    .kpi-meta {
      color: var(--muted); font-size: 12px;
    }
    .trend.up { color: #86efac; }
    .trend.down { color: #fca5a5; }

    .panel, .card-panel {
      padding: 16px;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 14px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #bbf7d0;
    }

    .chart-wrap {
      position: relative; height: 260px; width: 100%;
    }
    .chart-wrap.small { height: 220px; }
    .two-col { display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 16px; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .list-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(15, 23, 42, 0.72); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      font-size: 12px;
    }
    .list-item strong { font-weight: 700; }
    .tiny { font-size: 11px; color: var(--muted); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;
    }
    .mini-stat {
      background: rgba(15, 23, 42, 0.7); border-radius: 12px; border: 1px solid var(--line); padding: 14px;
    }
    .mini-stat .label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; }
    .mini-stat .value { font-size: 1.5rem; font-weight: 800; margin-top: 8px; }

    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td {
      padding: 10px 12px; border-bottom: 1px solid rgba(148,163,184,.14); font-size: 12px; text-align: left;
    }
    th {
      background: rgba(15, 23, 42, 0.8); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px;
    }
    td strong { font-weight: 700; }
    tbody tr:hover { background: rgba(45,212,191,0.03); }

    .field-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
    }
    .field {
      display: flex; flex-direction: column; gap: 8px;
      font-size: 12px;
    }
    .field label { color: var(--muted); font-size: 11px; }
    input, select, textarea {
      width: 100%; border-radius: 10px; border: 1px solid rgba(148,163,184,0.2); background: rgba(15, 23, 42, 0.9); color: var(--text);
      padding: 10px 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(45,212,191,0.48); box-shadow: 0 0 0 3px rgba(45,212,191,0.16);
    }
    textarea { min-height: 88px; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .map-card {
      height: 360px; overflow: hidden; border-radius: 12px; border: 1px solid var(--line);
    }
    #map { width: 100%; height: 100%; }
    .leaflet-container { background: #07111d; }
    .leaflet-control-attribution { background: rgba(15,23,42,0.7) !important; color: #dfeaf9 !important; }

    .info-box {
      border-radius: 12px; border: 1px solid rgba(96,165,250,0.25); background: rgba(30,64,175,0.12); padding: 12px 14px; color: #dbeafe; font-size: 12px; line-height: 1.5;
    }
    .success-box {
      border-radius: 12px; border: 1px solid rgba(34,197,94,0.3); background: rgba(20,83,45,0.18); padding: 12px 14px; color: #dcfce7; font-size: 12px;
    }
    .warn-box {
      border-radius: 12px; border: 1px solid rgba(251,191,36,0.25); background: rgba(120,53,15,0.2); padding: 12px 14px; color: #fef3c7; font-size: 12px;
    }

    .stack { display: grid; gap: 12px; }

    .pill-list { display:flex; gap:8px; flex-wrap:wrap; }
    .pill {
      display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(148,163,184,.2); background: rgba(15,23,42,.72); border-radius:999px; padding:6px 8px; font-size:11px; color: var(--muted);
    }

    @media (max-width: 980px) {
      .two-col { grid-template-columns: 1fr; }
      .sidebar { width: 200px; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .content-shell { flex-direction: column; }
      .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); max-height: 280px; }
      .main-panel { padding-top: 12px; }
      .topbar { height: auto; padding: 12px 14px; align-items: flex-start; flex-wrap: wrap; }
      .toolbar { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="logo" id="logo"></div>
        <div>
          <div class="brand-title">Sena FarmERP <span style="color:#7ef2dc;font-weight:900">v8.3</span></div>
          <div class="brand-sub">
            <span id="statusChip" class="badge success">online</span>
            <span class="dot"></span>
            <span id="cloudState">local mode</span>
            <span class="dot"></span>
            <span id="userName">Local Operator</span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div id="langSwitch" class="lang-switch"></div>
        <span id="roleBadge" class="badge info">CEO / Admin</span>
        <button class="btn secondary" id="syncBtn" type="button">🔄 Sync</button>
        <button class="btn secondary" id="exportBtn" type="button">⬇ Export</button>
        <button class="btn danger" id="logoutBtn" type="button">⏻ Logout</button>
      </div>
    </header>

    <div class="content-shell">
      <aside class="sidebar">
        <div id="navRoot"></div>
      </aside>

      <main class="main-panel">
        <div id="moduleRoot" class="module-view"></div>
      </main>
    </div>
  </div>

  <script>
    const VERSION = '8.3.0';
    const STORAGE_KEYS = {
      session: 'sena_farmerp_session',
      supabase: 'sena_farmerp_supabase',
      exports: 'sena_farmerp_backup',
      data: 'sena_farmerp_data'
    };

    const LANGS = [
      { code: 'en', label: 'English', flag: '🇬🇧' },
      { code: 'am', label: 'አማርኛ', flag: '🇪🇹' },
      { code: 'om', label: 'Afaan Oromoo', flag: '🇪🇹' },
      { code: 'so', label: 'Af-Soomaali', flag: '🇸🇴' },
      { code: 'ti', label: 'ትግርኛ', flag: '🇪🇹' },
      { code: 'fr', label: 'Français', flag: '🇫🇷' }
    ];

    const I18N = {
      en: {
        dashboard: 'Dashboard',
        records: 'Field Records',
        operations: 'Operations',
        crop_health: 'Crop Health',
        procurement: 'Procurement',
        finance: 'Finance',
        team: 'Team & Workflow',
        media: 'Media & Outreach',
        intelligence: 'AI Copilot',
        map: 'Geo & GIS',
        compliance: 'Compliance'
      },
      am: {
        dashboard: 'ዳሽቦርድ',
        records: 'የመስክ መዝገቦች',
        operations: 'ስራዎች',
        crop_health: 'የምርት ጤና',
        procurement: 'ግዥ',
        finance: 'ፋይናንስ',
        team: 'ቡድን እና ሂደት',
        media: 'ሚዲያ እና ማስተላለፍ',
        intelligence: 'AI ምክትል',
        map: 'ጂኦ እና GIS',
        compliance: 'ተገዢነት'
      }
    };

    const MODULES = [
      { key: 'dashboard', label: 'Dashboard', icon: '📊' },
      { key: 'records', label: 'Field Records', icon: '📝' },
      { key: 'operations', label: 'Operations', icon: '🚜' },
      { key: 'crop_health', label: 'Crop Health', icon: '🌿' },
      { key: 'procurement', label: 'Procurement', icon: '🧾' },
      { key: 'finance', label: 'Finance', icon: '💰' },
      { key: 'team', label: 'Team & Approval', icon: '👥' },
      { key: 'media', label: 'Media & Outreach', icon: '📸' },
      { key: 'intelligence', label: 'AI Copilot', icon: '🤖' },
      { key: 'map', label: 'Geo & GIS', icon: '📍' },
      { key: 'compliance', label: 'Compliance', icon: '✅' }
    ];

    const seed = {
      user: { name: 'Local Operator', role: 'CEO / Admin', locale: 'en' },
      records: [
        { id: 'F-1001', farmer: 'Abdi Seid', plot: 'Afar North 12', crop: 'Coffee', stage: 'Flowering', value: '$5,800', risk: 'Low', date: '2026-10-22', status: 'approved' },
        { id: 'F-1002', farmer: 'Tigist Hailu', plot: 'Meki South 08', crop: 'Maize', stage: 'Germination', value: '$3,100', risk: 'Medium', date: '2026-10-24', status: 'pending' },
        { id: 'F-1003', farmer: 'Bekele Tadesse', plot: 'Kombolcha 11', crop: 'Wheat', stage: 'Harvest', value: '$7,650', risk: 'Low', date: '2026-10-20', status: 'approved' },
        { id: 'F-1004', farmer: 'Yared Yusuf', plot: 'Jimma East 04', crop: 'Sorghum', stage: 'Irrigation', value: '$2,960', risk: 'High', date: '2026-10-18', status: 'review' }
      ],
      tasks: [
        { task: 'Soil sample review', unit: 'Kombolcha', owner: 'Agronomist', due: 'Today', status: 'In Progress' },
        { task: 'Finance reconciliation', unit: 'HQ', owner: 'Finance', due: 'Today', status: 'Awaiting CEO approval' },
        { task: 'Field officer route plan', unit: 'Jimma', owner: 'Operations Manager', due: 'Tomorrow', status: 'Ready' },
        { task: 'Input inventory count', unit: 'Procurement', owner: 'Procurement Lead', due: '3 days', status: 'Scheduled' }
      ],
      ai: [
        { title: 'Irrigation efficiency', detail: 'North plots are 14% below optimal moisture retention. Recommend drip calibration.', impact: 'High' },
        { title: 'Market intelligence', detail: 'Coffee prices remain elevated in export channels, improve harvest sequencing for priority lots.', impact: 'Medium' },
        { title: 'Field risk', detail: 'Fungal risk is elevated on 3 plots due to high humidity. Increase scouting every 48 hours.', impact: 'High' }
      ],
      approvals: [
        { id: 'APR-201', subject: 'Capital input purchase', approver: 'Operations Manager', state: 'Submitted', decision: 'Pending CEO' },
        { id: 'APR-202', subject: 'Harvest lot allocation', approver: 'Agronomy Lead', state: 'Approved', decision: 'Board review' },
        { id: 'APR-203', subject: 'Export tender', approver: 'CEO', state: 'Final approval', decision: 'Approved' }
      ],
      geo: [
        { label: 'HQ', lat: 8.98, lng: 38.8 },
        { label: 'Jimma', lat: 7.67, lng: 36.84 },
        { label: 'Kombolcha', lat: 11.08, lng: 39.74 },
        { label: 'Meki', lat: 8.15, lng: 38.8 }
      ],
      media: [
        { type: 'Photo', label: 'Field capture', created: 'Today 08:42', status: 'Synced' },
        { type: 'Video', label: 'Training session', created: 'Today 11:10', status: 'Stored' },
        { type: 'Audio', label: 'Farmer report', created: 'Yesterday', status: 'Uploaded' }
      ],
      kpis: {
        totalFarms: 68,
        activePlots: 240,
        harvestValue: '$2.84M',
        yieldIndex: 93,
        pendingApprovals: 12,
        syncHealth: '99.2%'
      }
    };

    const state = {
      lang: 'en',
      currentModule: 'dashboard',
      data: JSON.parse(localStorage.getItem(STORAGE_KEYS.data) || JSON.stringify(seed)),
      supabase: JSON.parse(localStorage.getItem(STORAGE_KEYS.supabase) || JSON.stringify({ url: '', key: '', enabled: false }))
    };

    function logoSvg(size = 42) {
      return `
        <svg viewBox="0 0 120 120" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" aria-label="Sena logo">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6ee7b7"/>
              <stop offset="100%" stop-color="#10b981"/>
            </linearGradient>
          </defs>
          <path d="M34 22 C56 28, 78 48, 78 70 C78 88, 63 102, 42 106 C57 90, 63 72, 56 54 C51 42, 42 31, 34 22 Z" fill="url(#g1)"/>
          <path d="M55 28 C71 38, 84 56, 83 76 C82 92, 66 104, 49 110 C60 95, 65 79, 60 63 C57 51, 55 39, 55 28 Z" fill="url(#g1)" opacity="0.7"/>
          <circle cx="60" cy="56" r="4" fill="#fbbf24"/>
        </svg>`;
    }

    document.getElementById('logo').innerHTML = logoSvg(42);

    function saveData() {
      localStorage.setItem(STORAGE_KEYS.data, JSON.stringify(state.data));
    }

    function saveSupabaseConfig() {
      localStorage.setItem(STORAGE_KEYS.supabase, JSON.stringify(state.supabase));
    }

    function applyLanguage() {
      const labels = I18N[state.lang] || I18N.en;
      const nav = MODULES.map(m => ({ ...m, label: labels[m.key] || m.label }));
      renderNav(nav);
      renderModule();
      renderLangButtons();
      document.getElementById('userName').textContent = state.data.user.name;
      document.getElementById('roleBadge').textContent = state.data.user.role;
      document.getElementById('cloudState').textContent = state.supabase.enabled ? `${state.supabase.url ? 'Supabase' : 'cloud ready'}` : 'local mode';
    }

    function renderLangButtons() {
      const root = document.getElementById('langSwitch');
      root.innerHTML = LANGS.map(lang => `
        <button class="lang-btn ${state.lang === lang.code ? 'active' : ''}" data-lang="${lang.code}" type="button">${lang.flag} ${lang.label}</button>
      `).join('');
      root.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => {
        state.lang = btn.dataset.lang;
        applyLanguage();
      }));
    }

    function renderNav(navItems) {
      const navRoot = document.getElementById('navRoot');
      const groups = [
        { title: 'Operations', items: navItems.slice(0, 5) },
        { title: 'Performance', items: navItems.slice(5, 9) },
        { title: 'Digital', items: navItems.slice(9) }
      ];

      navRoot.innerHTML = groups.map(group => `
        <div class="nav-group">
          <div style="padding: 0 8px 6px;color:#7dd3fc;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:0.8;">${group.title}</div>
          ${group.items.map(item => `
            <button class="nav-btn ${state.currentModule === item.key ? 'active' : ''}" data-module="${item.key}" type="button">
              <span>${item.icon} ${item.label}</span>
              <small>${item.key === 'dashboard' ? 'live' : 'module'}</small>
            </button>
          `).join('')}
        </div>
      `).join('');

      navRoot.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => {

      toastRoot.style.color = '#e2e8f0';

    function exportJson() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

    }

    function exportCsv(filename) {
      const rows = state.data.records;
      const headers = ['ID', 'Farmer', 'Plot', 'Crop', 'Stage', 'Risk', 'Value', 'Date', 'Status'];
      const csv = [headers.join(',')].concat(rows.map(r => [r.id, r.farmer, r.plot, r.crop, r.stage, r.risk, r.value, r.date, r.status].join(','))).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${filename}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast('CSV export downloaded.', 'ok');
    }

    function openMediaCapture(type) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = type === 'image' ? 'image/*' : type === 'audio' ? 'audio/*' : 'video/*';
      input.onchange = () => {
        const f = input.files[0];
        if (f) {
          state.data.media.unshift({ type: type[0].toUpperCase() + type.slice(1), label: f.name, created: 'Now', status: 'Captured' });
          saveData();
          renderMedia();
          toast(`${type.toUpperCase()} media captured and queued for sync.`, 'ok');
        }
      };
      input.click();
    }

    function openExternalLink(href) {
      window.open(href, '_blank', 'noopener,noreferrer');
    }

    function generateAiInsight() {
      const insight = [
        'Irrigation optimization is the highest-value action for the North plots.',
        'Coffee export margin is above target thanks to premium pricing signals.',
        'Three blocks show short-term fungal risk and should be prioritized for scouting.'
      ];
      state.data.ai.unshift({ title: 'AI recommendation', detail: insight.join(' '), impact: 'High' });
      saveData();
      renderDashboard();
      toast('AI insight refreshed from field logic engine.', 'ok');
    }

    function initializeCharts() {
      const prodCtx = document.getElementById('prodChart');
      if (prodCtx) {
        new Chart(prodCtx, {
          type: 'line',
          data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
            datasets: [{
              label: 'Yield Index',
              data: [68, 72, 80, 85, 91, 96],
              borderColor: '#2dd4bf',
              backgroundColor: 'rgba(45,212,191,0.15)',
              fill: true,
              tension: 0.35
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
      }

      const revenueCtx = document.getElementById('revenueChart');
      if (revenueCtx) {
        new Chart(revenueCtx, {
          type: 'doughnut',
          data: {
            labels: ['Coffee', 'Maize', 'Wheat', 'Horticulture'],
            datasets: [{
              data: [42, 25, 16, 17],
              backgroundColor: ['#2dd4bf', '#60a5fa', '#fbbf24', '#a78bfa']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
      }
    }

    function initializeOpsChart() {
      const ctx = document.getElementById('opsChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
          datasets: [{
            label: 'Field tasks',
            data: [8, 12, 10, 15, 13, 18],
            backgroundColor: ['#0f766e', '#14b8a6', '#10b981', '#22c55e', '#2dd4bf', '#6ee7b7']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    function initializeHealthChart() {
      const ctx = document.getElementById('healthChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['Irrigation', 'Soil', 'Disease', 'Resilience', 'Nutrition', 'Yield'],
          datasets: [{
            label: 'Health index',
            data: [88, 84, 72, 90, 86, 93],
            backgroundColor: 'rgba(45,212,191,0.15)',
            borderColor: '#2dd4bf',
            pointBackgroundColor: '#2dd4bf'
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function initializeCashChart() {
      const ctx = document.getElementById('cashChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
          datasets: [{
            label: 'Cash flow',
            data: [380, 420, 450, 510, 560, 620],
            borderColor: '#60a5fa',
            backgroundColor: 'rgba(96,165,250,0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    function initMap() {
      const map = L.map('map').setView([8.9, 38.8], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      state.data.geo.forEach((point) => {
        L.marker([point.lat, point.lng]).addTo(map).bindPopup(point.label);
      });
    }

    function persistDefaultSession() {
      const session = { user: state.data.user, lang: state.lang, loggedIn: true, ts: Date.now() };
      localStorage.setItem(STORAGE_KEYS.session, JSON.stringify(session));
    }

    function syncAll() {
      saveData();
      const enabled = state.supabase.enabled && state.supabase.url && state.supabase.key;
      if (enabled) {
        toast('Cloud sync initiated to Supabase.', 'ok');
      } else {
        toast('Offline sync complete. Cloud is ready when configured.', 'info');
      }
    }

    function logout() {
      localStorage.removeItem(STORAGE_KEYS.session);
      toast('Session ended. Returning to secure login.', 'warn');
      setTimeout(() => window.location.reload(), 600);
    }

    document.getElementById('syncBtn').addEventListener('click', syncAll);
    document.getElementById('exportBtn').addEventListener('click', exportJson);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    (function init() {
      state.data.user = state.data.user || { name: 'Local Operator', role: 'CEO / Admin', locale: 'en' };
      state.data.user.role = state.data.user.role || 'CEO / Admin';
      persistDefaultSession();
      applyLanguage();
      renderModule();
    })();
  </script>
</body>
</html>
